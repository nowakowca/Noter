<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noter</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>📝 Noter</h1>
        <p class="subtitle">Keep track of things worth remembering.</p>
      </header>

      <form id="item-form" class="card item-form" autocomplete="off">
        <input type="hidden" id="item-id" />
        <div class="field">
          <label for="name">Name <span class="required">*</span></label>
          <input type="text" id="name" placeholder="What is it?" required />
        </div>
        <div class="field">
          <label for="link">Hyperlink</label>
          <input type="url" id="link" placeholder="https://example.com" />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" rows="2" placeholder="Any details…"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Add item</button>
          <button type="button" id="cancel-btn" class="btn btn-ghost hidden">Cancel</button>
        </div>
      </form>

      <div class="list-toolbar">
        <div class="filters" role="tablist">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="active">Active</button>
          <button class="filter" data-filter="completed">Completed</button>
        </div>
        <span id="counter" class="counter"></span>
      </div>

      <ul id="items" class="items"></ul>
      <p id="empty-state" class="empty-state hidden">Nothing here yet — add your first item above.</p>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
