services:
  noter:
    build: .
    image: noter
    container_name: noter
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      # Downloaded Instagram media is written here (inside the container).
      - MEDIA_DIR=/app/media
    volumes:
      # App state (SQLite database, saved login sessions).
      - noter-data:/app/data
      # Backed-up media. Point MEDIA_PATH at any host directory to save your
      # backups outside the app — e.g. MEDIA_PATH=/home/me/Pictures/instagram
      # (set it in a .env file next to this compose file, or in your shell).
      # Defaults to ./backups next to this file.
      - ${MEDIA_PATH:-./backups}:/app/media
    restart: unless-stopped

volumes:
  noter-data:
